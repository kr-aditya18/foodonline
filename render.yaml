# render.yaml — FoodOnline / UrbanEats
# Email: Brevo SMTP only. Gmail completely removed.

services:
  - type: web
    name: foodonline
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: foodonline_main.settings_render

      - key: SECRET_KEY
        sync: false

      - key: DEBUG
        value: "False"

      # ── Database (Supabase) ──────────────────────────────────────────────
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.hhygyqnvyviswtcfcksg
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: aws-1-ap-south-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"

      # ── Email — Brevo SMTP ONLY ──────────────────────────────────────────
      # Old Gmail vars REMOVED: EMAIL_HOST, EMAIL_PORT, EMAIL_HOST_USER,
      #                          EMAIL_HOST_PASSWORD, EMAIL_USE_TLS
      #
      # Step 1: Sign up free at https://app.brevo.com (no credit card)
      # Step 2: Go to SMTP & API → SMTP → Generate a new SMTP key
      # Step 3: Go to Senders & IPs → Senders → verify your sender email
      # Step 4: Set these 3 vars in Render dashboard → Environment

      - key: BREVO_SMTP_LOGIN
        sync: false   # Your Brevo account login email

      - key: BREVO_SMTP_KEY
        sync: false   # SMTP key from Brevo dashboard (NOT your password)

      - key: DEFAULT_FROM_EMAIL
        sync: false   # Must match a verified sender in Brevo
                      # Format: UrbanEats <noreply@yourdomain.com>

      # ── Cloudinary ───────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Payments ─────────────────────────────────────────────────────────
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # ── Superuser (first deploy only) ────────────────────────────────────
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false