{% load static %}
{% comment %}
FILE LOCATION: templates/ai_assistant/chatbot_widget.html
Include in base.html just before </body>:
    {% include 'ai_assistant/chatbot_widget.html' %}
{% endcomment %}

<link rel="stylesheet" href="{% static 'ai_assistant/css/chatbot.css' %}">

<!-- ── FLOATING ACTION BUTTON ── -->
<button id="foi-fab" aria-label="Open AI Food Assistant" title="AI Food Assistant">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C6.48 2 2 6.04 2 11c0 2.67 1.19 5.07 3.08 6.74L4 22l4.36-1.45C9.43 21.14 10.7 21.4 12 21.4c5.52 0 10-4.04 10-9.2S17.52 2 12 2z" fill="white"/>
    <circle cx="8.5"  cy="11" r="1.2" fill="#e31837"/>
    <circle cx="12"   cy="11" r="1.2" fill="#e31837"/>
    <circle cx="15.5" cy="11" r="1.2" fill="#e31837"/>
  </svg>
  <span id="foi-fab-dot"></span>
</button>

<!-- ── CHAT WINDOW ── -->
<div id="foi-chat-window" role="dialog" aria-label="FoodOnline AI Assistant" aria-modal="true">

  <!-- Header -->
  <div id="foi-chat-header">
    <div class="foi-avatar">🍽️</div>
    <div class="foi-header-info">
      <div class="foi-header-name">FoodOnline Assistant</div>
      <div class="foi-header-status">
        <span class="foi-status-dot"></span> Online &amp; Ready to Help
      </div>
    </div>
    <div class="foi-header-actions">
      <button class="foi-header-btn" id="foi-clear-btn" title="New conversation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
      <button class="foi-header-btn" id="foi-close-btn" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6"  x2="6"  y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Role badge -->
  <div id="foi-role-badge">
    Mode: <span id="foi-role-label">Loading…</span>
  </div>

  <!--
    #foi-messages contains BOTH chat bubbles AND the typing indicator.
    The typing indicator must be a child of #foi-messages so that
    appendMessage() can use insertBefore(wrapper, typingEl) correctly.
    This keeps typing dots always at the bottom of the message list.
  -->
  <div id="foi-messages" aria-live="polite" aria-label="Chat messages">

    <div class="foi-msg foi-bot" id="foi-typing" aria-hidden="true" style="display:none;">
      <div class="foi-bubble">
        <div class="foi-typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

  </div>

  <!-- Suggestion chips (outside messages, below it) -->
  <div id="foi-suggestions" aria-label="Suggested questions"></div>

  <!-- Input area -->
  <div id="foi-input-area">
    <div id="foi-input-wrap">
      <textarea
        id="foi-input"
        rows="1"
        placeholder="Ask me anything about food…"
        aria-label="Chat message"
        maxlength="1000"
      ></textarea>
      <button id="foi-voice-btn" title="Voice input" aria-label="Use voice input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8"  y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <button id="foi-send-btn" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div id="foi-chat-footer">
    Powered by <strong>FoodOnline AI</strong> &bull; Free &amp; Smart
  </div>

</div><!-- /#foi-chat-window -->

<!--
  Config bridge: passes Django context values to the static JS file via data attributes.
  CSRF is intentionally omitted here — chatbot.js reads it from the csrftoken
  cookie using getCookie('csrftoken'), which Django sets automatically.
  This is the standard Django AJAX pattern and is already in your other JS files.
-->
<div id="foi-config"
  data-chat-url="/ai/chat/"
  data-clear-url="/ai/clear-session/"
  data-history-url="/ai/history/"
  data-status-url="/ai/status/"
  data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}"
  data-role="{{ user_role|default:'guest' }}"
  style="display:none"
  aria-hidden="true"
></div>

<script src="{% static 'ai_assistant/js/chatbot.js' %}"></script>
