<!-- password_utils.html — include this in base.html just before </body> -->
<style>
  /* ── Eye-toggle wrapper ── */
  .field-holder { position: relative; }

  .pwd-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .pwd-wrapper input[type="password"],
  .pwd-wrapper input[type="text"] {
    width: 100%;
    padding-right: 42px !important; /* room for the eye */
  }

  .eye-btn {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: #888;
    display: flex;
    align-items: center;
    transition: color 0.2s;
    z-index: 2;
  }
  .eye-btn:hover { color: #333; }
  .eye-btn svg { width: 20px; height: 20px; pointer-events: none; }

  /* ── Password-match badge ── */
  .pwd-match-msg {
    font-size: 12px;
    font-weight: 600;
    margin-top: 5px;
    display: none;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.02em;
  }
  .pwd-match-msg.match   { color: #2ecc71; display: flex; }
  .pwd-match-msg.no-match { color: #e74c3c; display: flex; }
  .pwd-match-msg svg { width: 14px; height: 14px; flex-shrink: 0; }
</style>

<script>
(function () {
  /* SVG icons */
  const EYE_OPEN = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>`;

  const EYE_SHUT = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
               a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
               a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>`;

  const CHECK = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>`;

  const CROSS = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>`;

  /* ── Wrap every password input with the eye button ── */
  function wrapWithEye(input) {
    // avoid double-wrapping
    if (input.closest('.pwd-wrapper')) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'pwd-wrapper';
    input.parentNode.insertBefore(wrapper, input);
    wrapper.appendChild(input);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'eye-btn';
    btn.setAttribute('aria-label', 'Toggle password visibility');
    btn.innerHTML = EYE_OPEN;
    wrapper.appendChild(btn);

    btn.addEventListener('click', function () {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
    });
  }

  /* ── Add match indicator below the confirm-password field ── */
  function addMatchIndicator(pwdInput, confirmInput) {
    const msg = document.createElement('div');
    msg.className = 'pwd-match-msg';
    msg.innerHTML = CHECK + ' <span>Passwords match!</span>';

    // insert after the confirm wrapper (or the input itself)
    const anchor = confirmInput.closest('.pwd-wrapper') || confirmInput;
    anchor.parentNode.insertBefore(msg, anchor.nextSibling);

    function check() {
      const p = pwdInput.value;
      const c = confirmInput.value;
      if (!c) {
        msg.className = 'pwd-match-msg';          // hidden
        return;
      }
      if (p === c) {
        msg.className = 'pwd-match-msg match';
        msg.innerHTML = CHECK + ' <span>Passwords match!</span>';
      } else {
        msg.className = 'pwd-match-msg no-match';
        msg.innerHTML = CROSS + ' <span>Passwords do not match</span>';
      }
    }

    pwdInput.addEventListener('input', check);
    confirmInput.addEventListener('input', check);
  }

  /* ── Init (runs after DOM is ready) ── */
  function init() {
    /* 1. Eye toggle on every password field */
    document.querySelectorAll('input[type="password"]').forEach(wrapWithEye);

    /* 2. Match indicator — find password + confirm_password pairs */
    const forms = document.querySelectorAll('form');
    forms.forEach(function (form) {
      const pwd     = form.querySelector('[name="password"]');
      const confirm = form.querySelector('[name="confirm_password"]');
      if (pwd && confirm) {
        addMatchIndicator(pwd, confirm);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
